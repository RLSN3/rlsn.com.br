const PAGES = [
 {c:'dk cover',h:`<div class="in">${LOGO}<div class="mid"><h1 class="r">Proposta<br>Comercial</h1><span class="tag r">Identidade Visual</span><p class="hint r">Conheça a proposta passo a passo.</p></div></div>`},
 {c:'lt sp',h:split('',`<h2 class="r"><span class="g">Quem sou eu?</span></h2><ul class="ar">
 <li class="r">Olá, sou Railson Lima, tenho 33 anos, sou designer e Transformo perfis de Empreendedores Digitais em máquinas de conversão</li>
 <li class="r">Me formei em <b>Marketing Digital pela faculdade Pitágoras em 2022.</b> Fiz e ainda continuo fazendo várias especializações na área.</li>
 <li class="r"><b>Hoje sou um especialista</b> estratégico na área do design e marketing digital, além de buscar sempre as melhores soluções criativas que levam resultados para meus clientes.</li>
 <li class="r"><b>Eu posso te ajudar!</b><em>Que tal trabalharmos juntos no seu crescimento?</em></li></ul>${A(CONFIG.instagram,'','Clique aqui e conheça meu Instagram')}`,'foto','Railson Lima, designer','top')},
 {c:'dk idv',h:`<div class="in">${LOGO}<div class="mid"><h2 class="r">Identidade Visual</h2><p class="r">Uma boa identidade é uma expressão visual e verbal de uma marca. Você pode vê-la, tocá-la e senti-lá. Através de um processo único e objetivo, vamos entender a essência da sua empresa e transforma-lo em algo profissional e memorável.</p><p class="r">O Design desempenha um papel fundamental na criação e construção de marcas. Ele diferencia e incorpora os elementos intangíveis - emoção, contexto e essência - criando um laço profundo com o consumidor.</p></div></div>`},
 {c:'lt why',h:`<div class="in">${LOGO}<div style="margin-top:calc(70 * var(--u))"><h2 class="r"><span class="g rv">Por que ter uma identidade visual?</span></h2><p class="intro r">Nos dias atuais toda empresa é considerada como pessoa e isso a torna única. disso, sua marca irá trazer confiança para o público alvo, além de facilitar a identificação da sua empresa em todos os sentidos como, cartões de visita, sacolas, embalagens, redes sociais, envelopes, etc. Abaixo listo alguns motivos pelo qual você deve investir em um designer gráfico focado em identidade visual.</p><div class="cols"><div class="r"><h3 class="g">1. Agrega valor</h3><p>Empresas que desenvolvem um design único tendem a conseguir se diferenciar dos concorrentes aumentando o valor percebido pelos seus clientes.</p></div><div class="r"><h3 class="g rv">2. Visibilidade</h3><p>Marcas com design mal feito são claramente ignoradas pelos clientes fazendo com que o investimento em marketing seja maior.</p></div><div class="r"><h3 class="g">3. Conversão</h3><p>Um bom design traz resultado e praticidade na hora da compra, fazendo com que a conversão se torne mais gratificante.</p></div></div></div></div>`},
 {c:'dk sec',h:sec('Processo','de criação','Processo',1)},
 {c:'dk tl',h:`<div class="in">${LOGO}<div class="mid"><div class="line r">${["Briefing e pesquisa","Analises e estratégias","Rascunhos e testes","Construção","Apresentação","Entrega final"].map((t,i)=>`<div class="nd ${i%2?'up':'dn'}" style="left:${15+i*14}%"><i></i><span>${t}</span></div>`).join("")}</div><div class="cap"><p class="r">O projeto de criação de uma identidade visual é dividido em 6 grandes etapas</p><p class="r">A seguir irei explicar resumidamente como funciona cada um desses processos que me ajudam a construir uma marca forte, consistente e única</p></div></div></div>`},
 {c:'lt sp',h:split1('Pesquisa e Briefing',["Aqui é uma das etapas mais importantes. Indo direto ao ponto, o briefing é um documento que servirá como guia para a execução do seu projeto.","Ele funciona como um formulário para direcionar melhor os nossos estudos e análises e conhecer a fundo sobre a sua empresa. Assim, os envolvidos terão um direcionamento mais claro para a realização dos seus trabalhos e planos de ação."],'s7','Mãos digitando em um notebook')},
 {c:'lt sp',h:split1('Análise de Mercado',["A segunda etapa é onde o projeto entra em fase de brainstorming. Após coletarmos todos os dados importantes e entendermos a essência da empresa, fazemos diversos estudos e análises sobre o mercado ou nicho da qual a marca está inserida.","Para destacar seu negócio, analisaremos seus concorrentes de forma minuciosa para criar uma identidade única que o diferencie das outras empresas."],'s8','Pessoa analisando gráficos no papel')},
 {c:'lt sp',h:split1('Rascunhos e Testes',["Após definirmos os conceitos idealizadores da marca, damos início aos rascunhos. Basicamente é a etapa onde colocamos todas as nossas ideais no papel a fim de chegar em um resultado ideal. Aqui são testados diversos símbolos, formatos, cores, tipografias, patterns, conceitos, elementos de apoio e entre outros."],'s9','Designer desenhando em mesa digitalizadora')},
 {c:'lt sp',h:split1('Construção da marca',["Aqui é onde iremos consolidar e definir qual o melhor resultado tirado a partir  dos rascunhos. A partir dele, traçamos a identidade visual em sua forma final. Além disso, criamos os materiais de apoio, que demonstram como o projeto irá se adaptar na realidade e no mundo virtual."],'s10','Mãos digitando em um notebook')},
 {c:'lt sp',h:split1('Apresentação',["Nessa etapa iremos apresentar para você toda as estratégias tomadas para chegar no resultado final. Estabelecemos os princípios da marca, suas missões e objetivos.","A apresentação é onde o cliente irá imergir em todo o universo e ambiente criado por nós."],'s11','Notebook e canetas sobre a mesa')},
 {c:'lt sp',h:split1('Entrega do Projeto',["Após a apresentação e aprovação do trabalho, entregamos todos os ativos, manuais, arquivos e variações do projeto de forma organizada e intuitiva, visando auxiliar na fácil distribuição da marca por seus diversos meios, seja digital, físico ou institucional."],'s12','Notebook com boneco articulado ao fundo',`<div class="drv r"><img src="${IMG.drive}" alt="Google Drive"><p>A entrega de todos os arquivos são feitos pelo drive. Eles permanecem na plataforma durante 06 meses, após esse período, são deletados da nuvem.</p></div>`)},
 {c:'dk sec',h:sec('Portfólio','de projetos','Portfólio')},
 {c:'lt sp gl',h:port('Euselene Rodrigues','av14',`<p class="r">O conceito principal foi trabalhado em cima do Símbolo da psicóloga: personalidade e comportamento.<br>O resultado foi uma marca que transmite a essência da renovação.</p><p class="r">Dentro desse arquétipo temos como principais características que reforçam os valores da profissional:</p><p class="vals r">Acolhimento · Emptia · Amor · Renovação</p>`,['p14a','p14b','p14c'])},
 {c:'lt sp gl',h:port('Pitagoras Albuquerque','av15',`<p class="r">Nossa missão é criar uma relação entre as iniciais do nome do cliente A e P. A fusão das iniciais de forma geométrica e humanizada fazendo com que criasse uma conexão com o cliente transmitindo seriedade e confiabilidade para seus clientes.</p>`,['p15a','p15b','p15c'])},
 {c:'dk sec',h:sec('Entrega','do Projeto','Entrega')},
 {c:'lt ent',h:`<div class="in">${LOGO}<h2 class="r" style="margin-top:calc(70 * var(--u))"><span class="g">O que será entregue no projeto?</span></h2><div class="grid">
 <div class="r"><h3 class="g">Variações do logo</h3><p>Os principais códigos de cores (CMYK, RGB, Pantone e HEX)</p><p>- <b>Formatos importantes</b> para o meio digital e físico (JPG, PNG, PDF, Vetor e SVG)</p></div>
 <div class="r"><h3 class="g rv">Aplicaçoes</h3><p>Aplicações em materiais virtuais usados como protótipos para simular a realidade.</p><p>Também será entregue os materiais gráficos em pdf para impressão.</p></div>
 <div class="r"><h3 class="g">Apresentação</h3><p>Arquivo no qual mostramos todo o projeto ao cliente. Missões, valores, tipografia, cores, aplicações moodboards, mapa mental e entre outros.</p></div>
 <div class="r"><h3 class="g rv">Manuel da Marca</h3><p>Serve para mostrar o uso correto da marca em seus diversos meios e formatos<br>(Esse manual é opcional)</p></div></div></div>`},
 {c:'dk sec',h:sec('Investimento','','Investimento')},
 {c:'lt plans',h:`<div class="in">${LOGO}<p class="tip r">Passe o mouse ou role a roda sobre os planos para destacar cada um.</p><div class="row">${PLANOS.map((p,i)=>`<article class="card r ${p.rec?'rec':''}"><button class="badge" type="button" aria-pressed="false" title="Destacar este plano">${p.badge}</button><h3>${p.id}</h3><p class="ds">${p.desc}</p><div class="pr">${p.preco}</div><div class="det"><h4>${p.head}</h4><ul>${p.inc.map(x=>`<li>${x}</li>`).join("")}</ul>${p.nao.length?`<h4>O que não está incluso</h4><ul>${p.nao.map(x=>`<li class="no">${x}</li>`).join("")}</ul>`:''}${p.nota?`<p class="nt">${p.nota}</p>`:''}</div><div class="go"><a class="btn cta" href="${waPlano(p)}" target="_blank" rel="noopener">${p.btn} ↗</a><button class="tg" type="button" aria-expanded="false">Detalhes ▾</button></div></article>`).join("")}</div></div>`},
 {c:'lt pay',h:`<div class="in">${LOGO}<h2 class="r" style="margin-top:calc(70 * var(--u));color:#1b1b1b">Como funciona o pagamento?</h2><div class="row3"><div class="r"><h3>Feito através de:</h3><ul><li>Transferência Pix</li><li>Boleto Bancário</li></ul></div><div class="r"><h3>Formato:</h3><ul><li>O pagamento pode ser feito 50% antes do início do projeto e 50% após a entrega do mesmo</li><li>No caso dos dois planos com maior valor de investimento, pode ser feito o parcelamento<br><small>(Conferir taxa de parcelamento)</small></li></ul></div><div class="r"><ul><li>Desconto de 6% em pagamento antecipado</li><li>O Projeto só terá início com algum sinal de pagamento</li></ul></div></div></div>`},
 {c:'dk sec',h:sec('Dúvidas','frequentes','Dúvidas')},
 {c:'lt faq',h:`<div class="in">${LOGO}<div class="cols2"><div>${faqQ('Posso pagar apenas depois?','- Não, o pagamento é feito totalmente a vista ou pelo menos 50% antes e 50% depois ou parcelado em até no máximo 3x com juros')}${faqQ('Vocês fazem a impressão?','- Não, apenas enviamos os arquivos nos formatos corretos que devem ir para a gráfica. Inclusive, caso queira, podemos recomendar algumas.')}${faqQ('O projeto foi aprovado, e agora?','- Após a aprovação da apresentação, na semana seguinte, iremos enviar todos os arquivos como variações da marca, espaços de cores, arquivos')}</div><div>${faqQ('Não aprovei o projeto, a agora?','- Iremos analisar em conjunto todo o material respondido no Briefing. Caso seja identificado que o cliente enviou as orientações erradas ou contraditórias será cobrado uma taxa de 40%')}${faqQ('Quero alterar algo, e agora?','- Caso seja uma alteração simples, que não irá afetar o projeto de forma bruta, ela pode ser feita normalmente.')}${faqQ('Devo responder o Briefing?','- O Briefing é nosso guia. A resposta desse material de forma completa e coesa é obrigatória.')}</div></div></div>`},
 {c:'lt faq b',h:`<div class="in">${LOGO}<div class="cols2"><div>${faqQ('Quanto tempo tenho para responder o Briefing?','- Você tem até um mês para responder o briefing. Caso não o faça, o projeto se dará como encerrado.')}${faqQ('Vocês fazem apenas o logo?','- Não, nós desenvolvemos apenas o projeto de identidade visual completo.')}${faqQ('Quero outros serviços! Como faço?','- Além de identidade visual, também fazemos serviços de Social Media. Caso queira saber mais, entre em contato  que iremos te oferecer')}</div><div>${faqQ('Quero mais ativos no projeto! E agora?','- Me fale a quantidade de ativos ou extensões do projeto que você deseja que iremos fazer um novo')}${faqQ('Posso compartilhar os valores?','- Esses valores são exclusivos para sua empresa. Em nenhuma circunstância eles devem ser divulgados ou compartilhados.')}${faqQ('Tenho urgência no projeto?','- Para trabalhos com maior urgência, será cobrado uma taxa sob o valor total. Me conte no whatsapp qual sua necessidade que iremos fazer um novo orçamento.')}</div></div></div>`},
 {c:'dk sec obr',h:`<div class="in">${LOGO}<div class="mid"><div class="ghost" aria-hidden="true">Obrigado</div><h2 class="r">Obrigado!</h2><div class="bar r"></div><div class="links"><a class="r" href="${lnkPort}" target="_blank" rel="noopener"><img src="${IMG.bhe}" alt="">Conheça meu Portfólio</a><a class="r" href="${CONFIG.instagram}" target="_blank" rel="noopener"><img src="${IMG.ig}" alt="">Conheça meu Instagram</a><a class="r" href="${waGeral}" target="_blank" rel="noopener"><img src="${IMG.wa}" alt="">Para quaisquer dúvida</a></div></div></div>`}
];
/* ===== motor ===== */
const app=document.getElementById('app'),view=document.getElementById('view'),pv=document.getElementById('pv'),nx=document.getElementById('nx'),lbl=document.getElementById('lbl'),pb=document.getElementById('pb'),more=document.getElementById('more');
app.style.setProperty('--logo',`url(${IMG.logo})`);
const N=PAGES.length; let cur=0, secs=[];
PAGES.forEach((p,i)=>{const s=document.createElement('section');s.className='pg '+p.c;s.setAttribute('aria-label','Etapa '+(i+1)+' de '+N);s.innerHTML=p.h;view.appendChild(s);secs.push(s);
 s.querySelectorAll('.r').forEach((e,j)=>e.style.setProperty('--i',j));
 s.addEventListener('scroll',hint,{passive:true});});
document.querySelectorAll('.card').forEach(c=>{const b=c.querySelector('.tg');b.addEventListener('click',()=>{const o=c.classList.toggle('open');b.setAttribute('aria-expanded',o);b.textContent=o?'Ocultar ▴':'Detalhes ▾';setTimeout(hint,50)})});
const FINE=matchMedia('(hover:hover) and (pointer:fine)').matches,RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
function layout(){
 const W=innerWidth,H=innerHeight,bar=56+(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sb'))||0),Hu=H-bar;
 const s=Math.min(W/1920,Hu/1080), small=Math.min(W,H)<600;
 let m; if(W>1.1*H&&s>=.62)m='mS'; else if(W>1.1*H)m='mC'; else m='mV';
 app.className=m+(small?' sm':'')+(FINE?' fine':'');
 if(m==='mS'){app.style.setProperty('--k',1);view.style.cssText=`width:1920px;height:1080px;left:${(W-1920*s)/2}px;top:${(Hu-1080*s)/2}px;transform:scale(${s})`;}
 else{view.style.cssText='';app.style.setProperty('--k',m==='mV'?Math.max(.4,Math.min(.56,W/1000)):Math.max(.42,Math.min(.55,W/1900)));}
 hint();
}
const prow=document.querySelector('.plans .row'),cards=[...prow.querySelectorAll('.card')];
const setFx=(c,pin)=>cards.forEach(x=>{const on=x===c;x.classList.toggle('fx',on);x.dataset.pin=on&&pin?'1':'';x.querySelector('.badge').setAttribute('aria-pressed',on&&pin)});
cards.forEach(c=>{
 c.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%');if(!RM&&!c.classList.contains('fx')){c.style.setProperty('--ry',((x-.5)*10)+'deg');c.style.setProperty('--rx',((.5-y)*8)+'deg')}});
 c.addEventListener('pointerleave',()=>{c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')});
 c.querySelector('.badge').addEventListener('click',()=>setFx(c.dataset.pin?null:c,true));
});
prow.addEventListener('pointerleave',()=>cards.forEach(x=>{if(!x.dataset.pin)x.classList.remove('fx')}));
let wl=0;prow.addEventListener('wheel',e=>{if(!app.classList.contains('mS')||!FINE||Math.abs(e.deltaY)<6)return;e.preventDefault();const n=Date.now();if(n-wl<380)return;wl=n;let i=cards.findIndex(x=>x.classList.contains('fx'));if(i<0)i=cards.findIndex(x=>x.matches(':hover'));i=Math.max(0,Math.min(cards.length-1,i+(e.deltaY>0?1:-1)));setFx(cards[i],false)},{passive:false});

/* ===== interações imersivas em toda a proposta ===== */
view.insertAdjacentHTML('beforeend','<div class="glow" aria-hidden="true"></div>');
view.querySelectorAll('.cols>div,.ent .grid>div,.pay .row3>div,.faq .q,.drv').forEach(e=>e.classList.add('sf'));
view.querySelectorAll('.cols,.ent .grid,.pay .row3,.faq .cols2,.line').forEach(e=>e.classList.add('grp'));
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(10)}catch(_){}};
const isSm=()=>app.classList.contains('sm');
const pin=(c)=>{const on=!c.classList.contains('fx');c.closest('.grp').querySelectorAll('.sf,.nd').forEach(x=>x.classList.remove('fx'));if(on)c.classList.add('fx');buzz()};
view.querySelectorAll('.sf').forEach(c=>{
 const pos=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%');return[x,y]};
 c.addEventListener('pointermove',e=>{const[x,y]=pos(e);if(e.pointerType==='mouse'&&!RM&&!isSm()){c.style.setProperty('--ry',((x-.5)*8)+'deg');c.style.setProperty('--rx',((.5-y)*6)+'deg')}});
 c.addEventListener('pointerleave',()=>{c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')});
 c.addEventListener('pointerdown',e=>{pos(e);c.classList.add('press');setTimeout(()=>c.classList.remove('press'),650)});
 c.addEventListener('click',e=>{if(e.target.closest('a,button'))return;if(c.classList.contains('q')&&isSm()){c.classList.toggle('open');buzz();return}if(c.closest('.grp'))pin(c)});
});
view.querySelectorAll('.nd').forEach(n=>n.addEventListener('click',()=>pin(n)));
view.querySelectorAll('.btn').forEach(b=>{b.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const r=b.getBoundingClientRect();b.style.setProperty('--bx',((e.clientX-r.left)/r.width-.5)*10+'px');b.style.setProperty('--by',((e.clientY-r.top)/r.height-.5)*8+'px')});b.addEventListener('pointerleave',()=>{b.style.setProperty('--bx','0px');b.style.setProperty('--by','0px')})});
view.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const r=view.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;view.style.setProperty('--px',x*100+'%');view.style.setProperty('--py',y*100+'%');if(!RM){const s=secs[cur];s.style.setProperty('--gx',((x-.5)*2).toFixed(3));s.style.setProperty('--gy',((y-.5)*2).toFixed(3))}});
const lb=document.createElement('div');lb.id='lb';lb.innerHTML='<img alt=""><button type="button" aria-label="Fechar imagem">✕</button>';app.appendChild(lb);
view.addEventListener('click',e=>{const im=e.target.closest('.gal img');if(im){const li=lb.querySelector('img');li.src=im.src;li.alt=im.alt;lb.classList.add('on');lb.querySelector('button').focus()}});
lb.addEventListener('click',()=>lb.classList.remove('on'));
function go(n){n=Math.max(0,Math.min(N-1,n));cur=n;view.classList.toggle('dkp',secs[n].classList.contains('dk'));document.querySelectorAll('.card,.sf').forEach(c=>c.classList.remove('ready'));setTimeout(()=>{if(cur===n)secs[n].querySelectorAll('.card,.sf').forEach(c=>c.classList.add('ready'))},1500);secs.forEach((s,i)=>{const on=i===n;s.classList.toggle('on',on);s.inert=!on;s.setAttribute('aria-hidden',on?'false':'true');if(on)s.scrollTop=0;});
 lbl.textContent='Etapa '+(n+1)+' de '+N;pb.style.width=((n+1)/N*100)+'%';pv.disabled=n===0;nx.disabled=n===N-1;nx.textContent=n===0?'Começar →':'Próximo →';setTimeout(hint,60);}
function hint(){const s=secs[cur];more.classList.toggle('s',s.scrollHeight-s.clientHeight>24&&s.scrollTop+s.clientHeight<s.scrollHeight-24);}
pv.onclick=()=>go(cur-1);nx.onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(lb.classList.contains('on')){if(e.key==='Escape')lb.classList.remove('on');return}if(e.target.closest&&e.target.closest('a,button')&&(e.key==='Enter'||e.key===' '))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
let tx=0,ty=0;view.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
view.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(cur+(dx<0?1:-1))},{passive:true});
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,150));
if(window.ResizeObserver)new ResizeObserver(layout).observe(document.documentElement);
layout();go(0);
</script>
</body>
</html>
