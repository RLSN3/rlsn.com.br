const FQ=[[["Posso pagar apenas depois?","Não, o pagamento é feito totalmente a vista ou pelo menos 50% antes e 50% depois ou parcelado em até no máximo 3x com juros"],["Vocês fazem a impressão?","Não, apenas enviamos os arquivos nos formatos corretos que devem ir para a gráfica. Inclusive, caso queira, podemos recomendar algumas."],["O projeto foi aprovado, e agora?","Após a aprovação da apresentação, na semana seguinte, iremos enviar todos os arquivos como variações da marca, espaços de cores, arquivos"],["Não aprovei o projeto, a agora?","Iremos analisar em conjunto todo o material respondido no Briefing. Caso seja identificado que o cliente enviou as orientações erradas ou contraditórias será cobrado uma taxa de 40%"],["Quero alterar algo, e agora?","Caso seja uma alteração simples, que não irá afetar o projeto de forma bruta, ela pode ser feita normalmente."],["Devo responder o Briefing?","O Briefing é nosso guia. A resposta desse material de forma completa e coesa é obrigatória."]],
[["Quanto tempo tenho para responder o Briefing?","Você tem até um mês para responder o briefing. Caso não o faça, o projeto se dará como encerrado."],["Vocês fazem apenas o logo?","Não, nós desenvolvemos apenas o projeto de identidade visual completo."],["Quero outros serviços! Como faço?","Além de identidade visual, também fazemos serviços de Social Media. Caso queira saber mais, entre em contato  que iremos te oferecer"],["Quero mais ativos no projeto! E agora?","Me fale a quantidade de ativos ou extensões do projeto que você deseja que iremos fazer um novo"],["Posso compartilhar os valores?","Esses valores são exclusivos para sua empresa. Em nenhuma circunstância eles devem ser divulgados ou compartilhados."],["Tenho urgência no projeto?","Para trabalhos com maior urgência, será cobrado uma taxa sob o valor total. Me conte no whatsapp qual sua necessidade que iremos fazer um novo orçamento."]]];
const faq=a=>`<section class="pg lt">${LG}<div class="fqs grp">${a.map(q=>`<div class="fq r fxc"><h3 role="button" tabindex="0" aria-expanded="false">${q[0]}</h3><p>- ${q[1]}</p></div>`).join("")}</div></section>`;
const TL=["Briefing e pesquisa","Analises e estratégias","Rascunhos e testes","Construção","Apresentação","Entrega final"];

const SL=[
`<section class="pg dk">${LG}<div class="in"><h1 class="r" style="font-size:calc(150 * var(--u));line-height:1;font-weight:800;letter-spacing:-.03em">Proposta<br>Comercial</h1><span class="tag r">Identidade Visual</span></div></section>`,
`<section class="pg lt sp">${LG}<div class="tx"><div class="in"><h2 class="t2 gt r">Quem sou eu?</h2><div class="ar">${P("Olá, sou Railson Lima, tenho 33 anos, sou designer e Transformo perfis de Empreendedores Digitais em máquinas de conversão")}${P("Me formei em <b>Marketing Digital pela faculdade Pitágoras em 2022.</b> Fiz e ainda continuo fazendo várias especializações na área.")}${P("Hoje sou um especialista estratégico na área do design e marketing digital, além de buscar sempre as melhores soluções criativas que levam resultados para meus clientes.")}${P("<b>Eu posso te ajudar!</b><br><i>Que tal trabalharmos juntos no seu crescimento?</i>")}</div>${CONFIG.instagram?`<a class="btn r" ${ext(CONFIG.instagram)}>Clique aqui e conheça meu Instagram</a>`:""}</div></div><div class="ph"><img src="${IMG.eu}" alt="Railson Lima" style="object-position:50% 20%"></div></section>`,
`<section class="pg dk">${LG}<div class="in"><h2 class="t2 r" style="color:#fff">Identidade Visual</h2>${P("Uma boa identidade é uma expressão visual e verbal de uma marca. Você pode vê-la, tocá-la e senti-lá. Através de um processo único e objetivo, vamos entender a essência da sua empresa e transforma-lo em algo profissional e memorável.")}${P("O Design desempenha um papel fundamental na criação e construção de marcas. Ele diferencia e incorpora os elementos intangíveis - emoção, contexto e essência  - criando um laço profundo com o consumidor.")}</div></section>`,
`<section class="pg lt">${LG}<div class="in"><h2 class="t2 gt rv r">Por que ter uma identidade visual?</h2>${P("Nos dias atuais toda empresa é considerada como pessoa e isso a torna única. disso, sua marca irá trazer confiança para o público alvo, além de facilitar a identificação da sua empresa em todos os sentidos como, cartões de visita, sacolas, embalagens, redes sociais, envelopes, etc. Abaixo listo alguns motivos pelo qual você deve investir em um designer gráfico focado em identidade visual.")}<div class="cols grp">${[["1. Agrega valor","Empresas que desenvolvem um design único tendem a conseguir se diferenciar dos concorrentes aumentando o valor percebido pelos seus clientes."],["2. Visibilidade","Marcas com design mal feito são claramente ignoradas pelos clientes fazendo com que o investimento em marketing seja maior."],["3. Conversão","Um bom design traz resultado e praticidade na hora da compra, fazendo com que a conversão se torne mais gratificante."]].map(c=>`<div class="r fxc"><h3 class="gt">${c[0]}</h3><p>${c[1]}</p></div>`).join("")}</div></div></section>`,
sec("Processo<br>de criação","Processo"),
`<section class="pg dk">${LG}<div class="in"><div class="tl grp">${TL.map((l,i)=>`<div class="sx r fxc"><i></i><b class="${i%2?"up":"dn"}">${l}</b></div>`).join("")}</div><div class="cen">${P("O projeto de criação de uma identidade visual é divido em 6 grandes etapas")}${P("A seguir irei explicar resumidamente como funciona cada um desses processos que me ajudam a construir uma marca forte, consistente e única")}</div></div></section>`,
step("Pesquisa e Briefing","Aqui é uma das etapas mais importantes. Indo direto ao ponto, o briefing é um documento que servirá como guia para a execução do seu projeto.\n\nEle funciona como um formulário para direcionar melhor os nossos estudos e análises e conhecer a fundo sobre a sua empresa. Assim, os envolvidos terão um direcionamento mais claro para a realização dos seus trabalhos e planos de ação.","s7","Mãos digitando em um laptop"),
step("Análise de Mercado","A segunda etapa é onde o projeto entra em fase de brainstorming. Após coletarmos todos os dados importantes e entendermos a essência da empresa, fazemos diversos estudos e análises sobre o mercado ou nicho da qual a marca está inserida.\n\nPara destacar seu negócio, analisaremos seus concorrentes de forma minuciosa para criar uma identidade única que o diferencie das outras empresas.","s8","Mão escrevendo sobre gráficos"),
step("Rascunhos e Testes","Após definirmos os conceitos idealizadores da marca, damos início aos rascunhos.  Basicamente é a etapa onde colocamos todas as nossas ideais no papel a fim de chegar em um resultado ideal. Aqui são testados diversos símbolos, formatos, cores, tipografias, patterns, conceitos, elementos de apoio e entre outros.","s9","Designer usando mesa digitalizadora"),
step("Construção da marca","Aqui é onde iremos consolidar e definir qual o melhor resultado tirado a partir  dos rascunhos. A partir dele, traçamos a identidade visual em sua forma final. Além disso, criamos os materiais de apoio, que demonstram como o projeto irá se adaptar na realidade e no mundo virtual.","s7","Mãos digitando em um laptop"),
step("Apresentação","Nessa etapa iremos apresentar para você toda as estratégias tomadas para chegar no resultado final. Estabelecemos os princípios da marca, suas missões e objetivos.\n\nA apresentação é onde o cliente irá imergir em todo o universo e ambiente criado por nós.","s11","Teclado de notebook"),
