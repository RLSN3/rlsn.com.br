<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#090909">
  <title>Página não encontrada | RLSN</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090909;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif;padding:24px}
    main{width:min(100%,620px);text-align:center}
    .brand{font-size:14px;letter-spacing:.28em;font-weight:700;color:#aaa}
    .code{font-size:clamp(76px,18vw,144px);line-height:.95;letter-spacing:-.08em;font-weight:800;margin:42px 0 20px}
    h1{font-size:clamp(24px,5vw,38px);margin:0 0 14px;letter-spacing:-.04em}
    p{color:#aaa;line-height:1.7;font-size:16px;margin:0 auto 30px;max-width:440px}
    a{display:inline-block;padding:14px 22px;border:1px solid #777;border-radius:999px;color:#fff;text-decoration:none;font-size:14px;font-weight:700;transition:background .2s,color .2s}
    a:hover{background:#fff;color:#090909}
  </style>
</head>
<body>
  <main>
    <div class="brand">RLSN</div>
    <div class="code">404</div>
    <h1>Esta página não existe.</h1>
    <p>O endereço pode estar incorreto ou a página pode ter sido removida. Volte ao início para continuar.</p>
    <a href="https://rlsn.com.br/">Voltar para o site</a>
  </main>
</body>
</html>
